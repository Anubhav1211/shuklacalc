<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Site Marble & Tile Rate Calculator</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: white !important; font-size: 11pt; color: black !important; }
      .shadow-sm, .shadow-md, .shadow-xl { box-shadow: none !important; }
      .border { border-color: #cbd5e1 !important; }
      .printable-area { border: none !important; padding: 0 !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const DEFAULT_RATES = {
      "Italian Floor": 180,
      "Granite": 140,
      "Wall Tile": 75,
      "Floor Tile": 65,
      "Full Round Molding": 50,
      "Half Round Molding": 35,
      "Patti": 30,
      "Skirting": 40,
      "Epoxy": 25,
      "45 Degree Cutting": 30,
      "Dahel": 45,
      "Highliter Tile": 120,
      "Composite WC": 90,
      "Store Tile": 60,
      "General": 50
    };

    function App() {
      const formRef = useRef(null);

      const [sites, setSites] = useState(() => {
        const saved = localStorage.getItem('calc_sites');
        if (saved) {
          try { 
            const parsed = JSON.parse(saved);
            if (parsed && parsed.length > 0) {
              return parsed.map(s => ({
                ...s,
                rates: { ...DEFAULT_RATES, ...(s.rates || {}) },
                sectionAlignments: s.sectionAlignments || {},
                items: (s.items || []).map(item => ({
                  ...item,
                  section: item.section || 'General',
                  subHeading: item.subHeading || 'Main Work',
                  subSubHeading: item.subSubHeading || '',
                }))
              }));
            }
          } catch (e) {}
        }
        return [
          {
            id: 'site_' + Date.now(),
            name: 'New Site Project 1',
            client: 'Client Name',
            address: 'Site Address',
            createdDate: new Date().toISOString().split('T')[0],
            rates: { ...DEFAULT_RATES },
            sectionAlignments: {},
            items: []
          }
        ];
      });

      const [currentSiteId, setCurrentSiteId] = useState(() => sites[0]?.id || '');
      const [activeTab, setActiveTab] = useState('measurements');
      const [filterCategory, setFilterCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');

      const [newItem, setNewItem] = useState({
        section: 'LOBBY',
        subHeading: 'Main Work',
        subSubHeading: '',
        item: '',
        category: '45 Degree Cutting',
        unitType: 'sqft',
        multiplier: '1',
        dimRows: [{ lFt: '', lIn: '', wFt: '', wIn: '' }]
      });

      const [pendingEntryModal, setPendingEntryModal] = useState(null);

      const [editingItemId, setEditingItemId] = useState(null);
      const [editFormData, setEditFormData] = useState({});

      const [editingSectionName, setEditingSectionName] = useState(null);
      const [newSectionNameVal, setNewSectionNameVal] = useState('');

      const [editingSubHeadingName, setEditingSubHeadingName] = useState(null);
      const [newSubHeadingNameVal, setNewSubHeadingNameVal] = useState('');

      const [newCategoryName, setNewCategoryName] = useState('');
      const [newCategoryRate, setNewCategoryRate] = useState('');

      const [isNewSiteModalOpen, setIsNewSiteModalOpen] = useState(false);
      const [newSiteData, setNewSiteData] = useState({ name: '', client: '', address: '' });

      useEffect(() => {
        if (sites && sites.length > 0) {
          localStorage.setItem('calc_sites', JSON.stringify(sites));
        }
      }, [sites]);

      const currentSite = useMemo(() => {
        return sites.find(s => s.id === currentSiteId) || sites[0];
      }, [sites, currentSiteId]);

      const sortedCategories = useMemo(() => {
        if (!currentSite?.rates) return [];
        return Object.keys(currentSite.rates).sort((a, b) => a.localeCompare(b));
      }, [currentSite]);

      const autoSuggestLists = useMemo(() => {
        const sectionsSet = new Set();
        const subHeadingsSet = new Set();
        const subSubHeadingsSet = new Set();
        const itemsSet = new Set();

        if (currentSite && currentSite.items) {
          currentSite.items.forEach(i => {
            if (i.section) sectionsSet.add(i.section);
            if (i.subHeading) subHeadingsSet.add(i.subHeading);
            if (i.subSubHeading) subSubHeadingsSet.add(i.subSubHeading);
            if (i.item) itemsSet.add(i.item);
          });
        }

        return {
          sections: Array.from(sectionsSet),
          subHeadings: Array.from(subHeadingsSet),
          subSubHeadings: Array.from(subSubHeadingsSet),
          items: Array.from(itemsSet)
        };
      }, [currentSite]);

      const handleDownloadBackup = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(sites, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `marble_calculator_backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const handleRestoreBackup = (e) => {
        const fileReader = new FileReader();
        if (e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = event => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (Array.isArray(parsed) && parsed.length > 0) {
                setSites(parsed);
                setCurrentSiteId(parsed[0].id);
                alert("Backup successfully restore ho gaya hai!");
              } else {
                alert("Invalid backup file format!");
              }
            } catch (err) {
              alert("File read karne me error aayi!");
            }
          };
        }
      };

      const handleCreateSite = (e) => {
        e.preventDefault();
        if (!newSiteData.name) return;
        const newSite = {
          id: 'site_' + Date.now(),
          name: newSiteData.name,
          client: newSiteData.client || 'Client',
          address: newSiteData.address || '',
          createdDate: new Date().toISOString().split('T')[0],
          rates: { ...DEFAULT_RATES },
          sectionAlignments: {},
          items: []
        };
        setSites(prev => [...prev, newSite]);
        setCurrentSiteId(newSite.id);
        setIsNewSiteModalOpen(false);
        setNewSiteData({ name: '', client: '', address: '' });
      };

      const handleDeleteCurrentSite = () => {
        if (sites.length <= 1) {
          alert("Aap saari sites delete nahi kar sakte.");
          return;
        }
        if (window.confirm(`⚠️ CONFIRM DELETE:\n\nKya aap "${currentSite.name}" ko permanently delete karna chahte hain?`)) {
          const remainingSites = sites.filter(s => s.id !== currentSite.id);
          setSites(remainingSites);
          setCurrentSiteId(remainingSites[0].id);
        }
      };

      const handleRenameSection = (oldSectionName) => {
        if (!newSectionNameVal.trim()) return;
        const newSec = newSectionNameVal.trim();
        setSites(prev => prev.map(s => {
          if (s.id === currentSite.id) {
            const updatedAligns = { ...(s.sectionAlignments || {}) };
            if (updatedAligns[oldSectionName]) {
              updatedAligns[newSec] = updatedAligns[oldSectionName];
              delete updatedAligns[oldSectionName];
            }
            return {
              ...s,
              sectionAlignments: updatedAligns,
              items: s.items.map(item => item.section === oldSectionName ? { ...item, section: newSec } : item)
            };
          }
          return s;
        }));
        setEditingSectionName(null);
        setNewSectionNameVal('');
      };

      const handleSetSectionAlignment = (secName, align) => {
        setSites(prev => prev.map(s => {
          if (s.id === currentSite.id) {
            return {
              ...s,
              sectionAlignments: {
                ...(s.sectionAlignments || {}),
                [secName]: align
              }
            };
          }
          return s;
        }));
      };

      const handleDuplicateSection = (secName) => {
        const targetItems = currentSite.items.filter(i => i.section === secName);
        if (!targetItems || targetItems.length === 0) return;

        const newSecName = `${secName} (COPY)`;
        const timestamp = Date.now();
        const duplicatedItems = targetItems.map((item, idx) => ({
          ...item,
          id: `${timestamp}_${idx}`,
          section: newSecName
        }));

        setSites(prev => prev.map(s => {
          if (s.id === currentSite.id) {
            const currentAlign = (s.sectionAlignments || {})[secName] || 'left';
            return {
              ...s,
              sectionAlignments: {
                ...(s.sectionAlignments || {}),
                [newSecName]: currentAlign
              },
              items: [...s.items, ...duplicatedItems]
            };
          }
          return s;
        }));
      };

      const handleDuplicateSubHeading = (secName, subName) => {
        const targetItems = currentSite.items.filter(i => i.section === secName && i.subHeading === subName);
        if (!targetItems || targetItems.length === 0) return;

        const existingSections = Object.keys(groupedData);
        let destSection = prompt(`Kis Main Section me paste karna hai?\n(Available sections: ${existingSections.join(', ')})`, secName);
        if (!destSection) return;
        destSection = destSection.trim();

        const newSubName = `${subName} (COPY)`;
        const timestamp = Date.now();
        const duplicatedItems = targetItems.map((item, idx) => ({
          ...item,
          id: `${timestamp}_${idx}`,
          section: destSection,
          subHeading: newSubName
        }));

        setSites(prev => prev.map(s => {
          if (s.id === currentSite.id) {
            return {
              ...s,
              items: [...s.items, ...duplicatedItems]
            };
          }
          return s;
        }));
      };

      const handleDeleteEntireSection = (secName) => {
        if (window.confirm(`⚠️ CONFIRM DELETE:\n\nKya aap pure SECTION "${secName}" ko uske saare items ke saath DELETE karna chahte hain?`)) {
          setSites(prev => prev.map(s => {
            if (s.id === currentSite.id) {
              const updatedAligns = { ...(s.sectionAlignments || {}) };
              delete updatedAligns[secName];
              return {
                ...s,
                sectionAlignments: updatedAligns,
                items: s.items.filter(i => i.section !== secName)
              };
            }
            return s;
          }));
        }
      };

      const handleDeleteEntireSubHeading = (secName, subName) => {
        if (window.confirm(`⚠️ CONFIRM DELETE:\n\nKya aap SUB-HEADING "${subName}" ko uske saare items ke saath DELETE karna chahte hain?`)) {
          setSites(prev => prev.map(s => {
            if (s.id === currentSite.id) {
              return {
                ...s,
                items: s.items.filter(i => !(i.section === secName && i.subHeading === subName))
              };
            }
            return s;
          }));
        }
      };

      const handleQuickAddForSubheading = (secName, subName) => {
        setNewItem(prev => ({
          ...prev,
          section: secName,
          subHeading: subName,
          subSubHeading: '',
          item: '',
          dimRows: [{ lFt: '', lIn: '', wFt: '', wIn: '' }]
        }));
        if (formRef.current) {
          formRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      };

      const handleMoveItem = (itemId, direction) => {
        const items = [...currentSite.items];
        const index = items.findIndex(i => i.id === itemId);
        if (index === -1) return;

        const targetIndex = direction === 'up' ? index - 1 : index + 1;
        if (targetIndex < 0 || targetIndex >= items.length) return;

        const temp = items[index];
        items[index] = items[targetIndex];
        items[targetIndex] = temp;

        setSites(prev => prev.map(s => {
          if (s.id === currentSite.id) {
            return { ...s, items };
          }
          return s;
        }));
      };

      const handleMoveSubHeadingGroup = (secName, subName, direction) => {
        const items = [...currentSite.items];
        const indices = [];
        items.forEach((item, idx) => {
          if (item.section === secName && item.subHeading === subName) {
            indices.push(idx);
          }
        });

        if (indices.length === 0) return;
        const firstIdx = indices[0];
        const lastIdx = indices[indices.length - 1];

        if (direction === 'up' && firstIdx > 0) {
          const subBlock = items.splice(firstIdx, indices.length);
          items.splice(firstIdx - 1, 0, ...subBlock);
        } else if (direction === 'down' && lastIdx < items.length - 1) {
          const subBlock = items.splice(firstIdx, indices.length);
          items.splice(firstIdx - 1 + 1, 0, ...subBlock);
        }

        setSites(prev => prev.map(s => {
          if (s.id === currentSite.id) {
            return { ...s, items };
          }
          return s;
        }));
      };

      const handleRenameSubHeading = (secName, oldSubName) => {
        if (!newSubHeadingNameVal.trim()) return;
        setSites(prev => prev.map(s => {
          if (s.id === currentSite.id) {
            return {
              ...s,
              items: s.items.map(item => (item.section === secName && item.subHeading === oldSubName) ? { ...item, subHeading: newSubHeadingNameVal.trim() } : item)
            };
          }
          return s;
        }));
        setEditingSubHeadingName(null);
        setNewSubHeadingNameVal('');
      };

      const handleAddDimRow = () => {
        setNewItem(prev => ({
          ...prev,
          dimRows: [...prev.dimRows, { lFt: '', lIn: '', wFt: '', wIn: '' }]
        }));
      };

      const handleRemoveDimRow = (index) => {
        if (newItem.dimRows.length <= 1) return;
        setNewItem(prev => ({
          ...prev,
          dimRows: prev.dimRows.filter((_, i) => i !== index)
        }));
      };

      const handleDimRowChange = (index, field, value) => {
        setNewItem(prev => {
          const updated = [...prev.dimRows];
          updated[index][field] = value;
          return { ...prev, dimRows: updated };
        });
      };

      const handlePreAddCheck = (e) => {
        e.preventDefault();
        if (!newItem.item) return;

        let baseTotalQty = 0;
        let dimParts = [];
        const multFactor = parseFloat(newItem.multiplier) || 1;

        if (newItem.unitType === 'sqft') {
          newItem.dimRows.forEach(row => {
            const lFt = (parseFloat(row.lFt) || 0) + ((parseFloat(row.lIn) || 0) / 12);
            const hasWidthFt = row.wFt !== '' && row.wFt !== null && row.wFt !== undefined;
            const hasWidthIn = row.wIn !== '' && row.wIn !== null && row.wIn !== undefined;
            const hasWidth = hasWidthFt || hasWidthIn;
            const wFt = hasWidth ? ((parseFloat(row.wFt) || 0) + ((parseFloat(row.wIn) || 0) / 12)) : 1;

            if (lFt > 0) {
              const rowQty = lFt * wFt;
              baseTotalQty += rowQty;
              const lText = `${row.lFt || 0}'${row.lIn ? `-` + row.lIn + `"` : ''}`;
              if (hasWidth) {
                const wText = `${row.wFt || 0}'${row.wIn ? `-` + row.wIn + `"` : ''}`;
                dimParts.push(`${lText} X ${wText}`);
              } else {
                dimParts.push(`${lText}`);
              }
            }
          });
        } else {
          newItem.dimRows.forEach(row => {
            const runFt = (parseFloat(row.lFt) || 0) + ((parseFloat(row.lIn) || 0) / 12);
            if (runFt > 0) {
              baseTotalQty += runFt;
              const text = `${row.lFt || 0}'${row.lIn ? `-` + row.lIn + `"` : ''}`;
              dimParts.push(text);
            }
          });
        }

        if (baseTotalQty <= 0) {
          alert("Kripya sahi Length bharein!");
          return;
        }

        const finalTotalQty = baseTotalQty * multFactor;
        let joinedDims = dimParts.join(" + ");
        
        let dimensionLabel = "";
        if (dimParts.length > 1) {
          if (multFactor !== 1) {
            dimensionLabel = `(${joinedDims}) X ${multFactor}`;
          } else {
            dimensionLabel = `(${joinedDims})`;
          }
        } else {
          if (multFactor !== 1) {
            dimensionLabel = `${joinedDims} X ${multFactor}`;
          } else {
            dimensionLabel = `${joinedDims}`;
          }
        }

        const categoryRate = currentSite.rates[newItem.category] || 0;
        const totalCost = finalTotalQty * categoryRate;

        setPendingEntryModal({
          section: newItem.section || 'General',
          subHeading: newItem.subHeading || 'Main Work',
          subSubHeading: newItem.subSubHeading || '',
          item: newItem.item,
          category: newItem.category || sortedCategories[0],
          unitType: newItem.unitType,
          dimText: dimensionLabel,
          baseQty: parseFloat(baseTotalQty.toFixed(2)),
          multiplier: multFactor,
          qty: parseFloat(finalTotalQty.toFixed(2)),
          rate: categoryRate,
          totalCost: totalCost
        });
      };

      const handleConfirmAddEntry = () => {
        if (!pendingEntryModal) return;

        const itemToAdd = {
          id: Date.now().toString(),
          section: pendingEntryModal.section,
          subHeading: pendingEntryModal.subHeading,
          subSubHeading: pendingEntryModal.subSubHeading,
          item: pendingEntryModal.item,
          category: pendingEntryModal.category,
          unitType: pendingEntryModal.unitType,
          dimText: pendingEntryModal.dimText,
          qty: pendingEntryModal.qty
        };

        setSites(prev => prev.map(s => {
          if (s.id === currentSite.id) {
            return { ...s, items: [...s.items, itemToAdd] };
          }
          return s;
        }));

        setPendingEntryModal(null);

        setNewItem(prev => ({
          ...prev,
          item: '',
          multiplier: '1',
          dimRows: [{ lFt: '', lIn: '', wFt: '', wIn: '' }]
        }));
      };

      const handleDeleteItem = (itemId) => {
        if (window.confirm("⚠️ CONFIRM DELETE:\n\nKya aap is single entry/row ko DELETE karna chahte hain?")) {
          setSites(prev => prev.map(s => {
            if (s.id === currentSite.id) {
              return { ...s, items: s.items.filter(i => i.id !== itemId) };
            }
            return s;
          }));
        }
      };

      const handleStartEditItem = (item) => {
        setEditingItemId(item.id);
        setEditFormData({ ...item });
      };

      const handleSaveEditItem = () => {
        setSites(prev => prev.map(s => {
          if (s.id === currentSite.id) {
            return {
              ...s,
              items: s.items.map(item => {
                if (item.id === editingItemId) {
                  return {
                    ...editFormData,
                    qty: parseFloat(editFormData.qty) || 0
                  };
                }
                return item;
              })
            };
          }
          return s;
        }));
        setEditingItemId(null);
      };

      const handleRateChange = (category, value) => {
        const rate = parseFloat(value) || 0;
        setSites(prev => prev.map(s => {
          if (s.id === currentSite.id) {
            return { ...s, rates: { ...s.rates, [category]: rate } };
          }
          return s;
        }));
      };

      const handleAddNewCategory = (e) => {
        e.preventDefault();
        const trimmedName = newCategoryName.trim();
        if (!trimmedName) return;

        setSites(prev => prev.map(s => {
          if (s.id === currentSite.id) {
            return {
              ...s,
              rates: { ...s.rates, [trimmedName]: parseFloat(newCategoryRate) || 0 }
            };
          }
          return s;
        }));
        setNewCategoryName('');
        setNewCategoryRate('');
      };

      const handleDeleteCategory = (categoryName) => {
        if (window.confirm(`⚠️ CONFIRM DELETE:\n\nKya aap "${categoryName}" category ko DELETE karna chahte hain?`)) {
          setSites(prev => prev.map(s => {
            if (s.id === currentSite.id) {
              const updatedRates = { ...s.rates };
              delete updatedRates[categoryName];
              return { ...s, rates: updatedRates };
            }
            return s;
          }));
        }
      };

      const filteredItems = useMemo(() => {
        if (!currentSite?.items) return [];
        return currentSite.items.filter(item => {
          const matchesCategory = filterCategory === 'All' || item.category === filterCategory;
          const matchesSearch = item.item.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                item.section.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                item.subHeading.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        });
      }, [currentSite, filterCategory, searchQuery]);

      const groupedData = useMemo(() => {
        const sections = {};
        filteredItems.forEach(item => {
          const sec = item.section || 'General';
          const sub = item.subHeading || 'Main Work';

          if (!sections[sec]) sections[sec] = { subHeadings: {}, sqft: 0, rft: 0, cost: 0 };
          if (!sections[sec].subHeadings[sub]) sections[sec].subHeadings[sub] = { items: [], sqft: 0, rft: 0, cost: 0 };

          const rate = currentSite.rates[item.category] || 0;
          const cost = item.qty * rate;

          sections[sec].subHeadings[sub].items.push({ ...item, rate, cost });

          if (item.unitType === 'sqft') {
            sections[sec].subHeadings[sub].sqft += item.qty;
            sections[sec].sqft += item.qty;
          } else {
            sections[sec].subHeadings[sub].rft += item.qty;
            sections[sec].rft += item.qty;
          }

          sections[sec].subHeadings[sub].cost += cost;
          sections[sec].cost += cost;
        });
        return sections;
      }, [filteredItems, currentSite]);

      const totals = useMemo(() => {
        if (!currentSite?.items) return { sqft: 0, rft: 0, cost: 0, byCategory: {} };

        let totalSqFt = 0;
        let totalRft = 0;
        let totalCost = 0;
        const byCategory = {};

        currentSite.items.forEach(item => {
          const rate = currentSite.rates[item.category] || 0;
          const cost = item.qty * rate;

          if (item.unitType === 'sqft') totalSqFt += item.qty;
          if (item.unitType === 'rft') totalRft += item.qty;
          totalCost += cost;

          if (!byCategory[item.category]) {
            byCategory[item.category] = { sqft: 0, rft: 0, cost: 0, rate };
          }
          if (item.unitType === 'sqft') byCategory[item.category].sqft += item.qty;
          if (item.unitType === 'rft') byCategory[item.category].rft += item.qty;
          byCategory[item.category].cost += cost;
        });

        return { sqft: totalSqFt, rft: totalRft, cost: totalCost, byCategory };
      }, [currentSite]);

      const handleShareWhatsApp = () => {
        const message = `*SHUKLA MARBLE CONTRACTOR*\n` +
          `*Labor & Fitting Estimate*\n\n` +
          `*Site:* ${currentSite.name}\n` +
          `*Client:* ${currentSite.client}\n` +
          `*Date:* ${currentSite.createdDate}\n\n` +
          `-------------------------------\n` +
          `*Total Area:* ${totals.sqft.toFixed(2)} Sq Ft\n` +
          `*Total Running Ft:* ${totals.rft.toFixed(2)} Ft\n` +
          `*Grand Total Estimate:* ₹${totals.cost.toLocaleString('en-IN', { maximumFractionDigits: 0 })}\n` +
          `-------------------------------\n` +
          `Detailed estimate generated via Shukla Calc App.`;

        const encodedMessage = encodeURIComponent(message);
        window.open(`https://api.whatsapp.com/send?text=${encodedMessage}`, '_blank');
      };

      const getSectionJustifyClass = (align) => {
        if (align === 'center') return 'justify-center';
        if (align === 'right') return 'justify-end';
        return 'justify-start';
      };

      const getSectionTextAlignClass = (align) => {

                                      </td>

                                      <td className="p-2.5 text-right font-bold text-emerald-600">
                                        ₹{((isEditing ? (parseFloat(editFormData.qty) || 0) : item.qty) * (isEditing ? (currentSite.rates[editFormData.category] || 0) : item.rate)).toLocaleString('en-IN', { maximumFractionDigits: 2 })}
                                      </td>

                                      <td className="p-2.5 text-center no-print">
                                        {isEditing ? (
                                          <div className="flex items-center justify-center space-x-1">
                                            <button onClick={handleSaveEditItem} className="bg-emerald-600 text-white font-bold px-2 py-1 rounded text-[10px]">✓</button>
                                            <button onClick={() => setEditingItemId(null)} className="bg-slate-300 text-slate-700 font-bold px-2 py-1 rounded text-[10px]">✕</button>
                                          </div>
                                        ) : (
                                          <div className="flex items-center justify-center space-x-1">
                                            <button onClick={() => handleMoveItem(item.id, 'up')} className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-1.5 py-0.5 rounded text-[10px]" title="Move Row Up">⬆️</button>
                                            <button onClick={() => handleMoveItem(item.id, 'down')} className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-1.5 py-0.5 rounded text-[10px]" title="Move Row Down">⬇️</button>
                                            
                                            <button onClick={() => handleStartEditItem(item)} className="text-amber-600 font-bold px-1 hover:bg-amber-50 rounded" title="Edit Entry">✏️</button>
                                            <button onClick={() => handleDeleteItem(item.id)} className="text-rose-500 font-bold px-1 hover:bg-rose-50 rounded" title="Delete Row">✕</button>
                                          </div>
                                        )}
                                      </td>

                                    </tr>
                                  );
                                })}
                              </tbody>
                            </table>

                            <div className="bg-emerald-50/60 px-4 py-2 border-t border-slate-200 text-xs font-bold text-slate-800 flex justify-between items-center">
                              <span className="text-emerald-800">📌 Sub-Total for "{subName}":</span>
                              <div className="space-x-4">
                                <span>Area: {subData.sqft.toFixed(2)} Sq Ft</span>
                                {subData.rft > 0 && <span>RFT: {subData.rft.toFixed(2)} Ft</span>}
                                <span className="text-emerald-700 font-black">Cost: ₹{subData.cost.toLocaleString('en-IN', { maximumFractionDigits: 2 })}</span>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    );
                  })}
                </div>

              </div>
            )}

            {/* TAB 2: RATE CARD */}
            {activeTab === 'rates' && (
              <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm max-w-3xl mx-auto space-y-6">
                <div>
                  <h2 className="text-lg font-bold text-slate-800">Customize Fitting Rates for {currentSite.name}</h2>
                  <p className="text-xs text-slate-500">Aap naye fitting rates add kar sakte hain aur purane rates edit kar sakte hain.</p>
                </div>

                <form onSubmit={handleAddNewCategory} className="bg-slate-50 p-4 rounded-xl border border-slate-200 grid grid-cols-1 sm:grid-cols-12 gap-3 items-end">
                  <div className="sm:col-span-6">
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Nayi Category / Item Name</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Step Riser" 
                      value={newCategoryName}
                      onChange={e => setNewCategoryName(e.target.value)}
                      className="w-full text-xs font-medium border border-slate-300 rounded p-2 bg-white"
                      required
                    />
                  </div>
                  <div className="sm:col-span-4">
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Rate (₹ per unit)</label>
                    <input 
                      type="number" 
                      placeholder="e.g. 50" 
                      value={newCategoryRate}
                      onChange={e => setNewCategoryRate(e.target.value)}
                      className="w-full text-xs font-medium border border-slate-300 rounded p-2 bg-white"
                      required
                    />
                  </div>
                  <div className="sm:col-span-2">
                    <button type="submit" className="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold p-2 rounded text-xs">
                      + Add
                    </button>
                  </div>
                </form>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {sortedCategories.map((category) => {
                    const rate = currentSite.rates[category];
                    return (
                      <div key={category} className="flex items-center justify-between p-3 bg-slate-50 rounded-lg border border-slate-200">
                        <span className="text-xs font-semibold text-slate-700">{category}</span>
                        <div className="flex items-center space-x-2">
                          <input 
                            type="number" 
                            value={rate}
                            onChange={(e) => handleRateChange(category, e.target.value)}
                            className="w-16 text-xs font-bold border border-slate-300 rounded p-1 text-right bg-white"
                          />
                          <button onClick={() => handleDeleteCategory(category)} className="text-rose-500 text-xs px-1">✕</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 3: COST SUMMARY */}
            {activeTab === 'summary' && (
              <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6">
                <h2 className="text-lg font-bold text-slate-800">Cost Breakdown by Category</h2>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
                        <th className="p-3">Category</th>
                        <th className="p-3 text-right">Total Sq Ft</th>
                        <th className="p-3 text-right">Total RFT</th>
                        <th className="p-3 text-right">Applied Rate</th>
                        <th className="p-3 text-right">Total Cost</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {sortedCategories.map(cat => {
                        const val = totals.byCategory[cat];
                        if (!val) return null;
                        return (
                          <tr key={cat} className="hover:bg-slate-50">
                            <td className="p-3 font-semibold text-slate-800">{cat}</td>
                            <td className="p-3 text-right text-slate-600">{val.sqft > 0 ? `${val.sqft.toFixed(2)} sq ft` : '-'}</td>
                            <td className="p-3 text-right text-slate-600">{val.rft > 0 ? `${val.rft.toFixed(2)} ft` : '-'}</td>
                            <td className="p-3 text-right text-slate-600">₹{val.rate}</td>
                            <td className="p-3 text-right font-bold text-emerald-600">₹{val.cost.toLocaleString('en-IN', { maximumFractionDigits: 0 })}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                    <tfoot>
                      <tr className="bg-slate-900 text-white font-bold">
                        <td className="p-3">GRAND TOTAL</td>
                        <td className="p-3 text-right">{totals.sqft.toFixed(2)} sq ft</td>
                        <td className="p-3 text-right">{totals.rft.toFixed(2)} ft</td>
                        <td className="p-3 text-right">-</td>
                        <td className="p-3 text-right text-amber-400 text-sm">₹{totals.cost.toLocaleString('en-IN', { maximumFractionDigits: 0 })}</td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              </div>
            )}

            {/* TAB 4: PRINTABLE ESTIMATE */}
            {activeTab === 'print' && (
              <div className="space-y-4">
                <div className="flex justify-end gap-2 no-print">
                  <button 
                    onClick={handleShareWhatsApp} 
                    className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-sm flex items-center gap-1.5 shadow"
                  >
                    📱 Share on WhatsApp
                  </button>
                  <button 
                    onClick={() => window.print()} 
                    className="bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold px-4 py-2 rounded-lg text-sm shadow"
                  >
                    🖨️ Print / Save as PDF
                  </button>
                </div>

                <div className="bg-white p-8 rounded-xl border border-slate-200 shadow-md space-y-6 printable-area">
                  
                  <div className="border-b-2 border-slate-900 pb-5 space-y-3">
                    <div className="flex justify-between items-center flex-wrap gap-2">
                      <div>
                        <h1 className="text-3xl font-black text-slate-900 tracking-wider">
                          SHUKLA MARBLE CONTRACTOR
                        </h1>
                        <p className="text-xs font-semibold text-amber-600 uppercase tracking-widest mt-0.5">
                          Premium Italian Marble, Granite & Tile Fitting Specialist
                        </p>
                      </div>
                      <div className="text-right">
                        <span className="bg-slate-900 text-amber-400 font-extrabold text-xs px-3 py-1.5 rounded uppercase tracking-wider">
                          ESTIMATE
                        </span>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4 text-xs pt-2 text-slate-700 border-t border-slate-100">
                      <div className="space-y-0.5">
                        <p><strong>Client Name:</strong> <span className="text-slate-900 font-bold">{currentSite.client}</span></p>
                        <p><strong>Site Project:</strong> <span className="text-slate-900 font-bold">{currentSite.name}</span></p>
                        {currentSite.address && <p><strong>Address:</strong> {currentSite.address}</p>}
                      </div>
                      <div className="text-right space-y-0.5">
                        <p><strong>Estimate Date:</strong> {currentSite.createdDate}</p>
                        <p><strong>Work Type:</strong> Marble & Tile Labor Fitting</p>
                      </div>
                    </div>
                  </div>

                  <div className="space-y-6">
                    {Object.entries(groupedData).map(([sectionName, sectionData]) => {
                      const secAlign = (currentSite.sectionAlignments || {})[sectionName] || 'left';

                      return (
                        <div key={sectionName} className="border border-slate-300 rounded-lg overflow-hidden">
                          
                          <div className={`bg-slate-800 text-amber-400 px-3 py-2 font-bold text-xs flex items-center justify-between`}>
                            <span className={`flex-1 ${getSectionTextAlignClass(secAlign)}`}>MAIN SECTION: {sectionName.toUpperCase()}</span>
                            <span className="text-[11px] text-white font-normal ml-2">
                              Section Total: ₹{sectionData.cost.toLocaleString('en-IN', { maximumFractionDigits: 2 })}
                            </span>
                          </div>

                          {Object.entries(sectionData.subHeadings).map(([subName, subData]) => (
                            <div key={subName} className="border-b border-slate-200 last:border-0">
                              
                              <div className="bg-slate-200/90 px-3 py-2 text-xs font-extrabold text-slate-800 border-b border-slate-300">
                                📍 Sub-Heading: {subName}
                              </div>

                              <table className="w-full text-left text-[11px] border-collapse">
                                <thead>
                                  <tr className="border-b border-slate-200 text-black font-bold bg-slate-50">
                                    <th className="p-2">Sub-Sub Heading</th>
                                    <th className="p-2">Item Description</th>
                                    <th className="p-2">Dimensions</th>
                                    <th className="p-2 text-right">Qty</th>
                                    <th className="p-2 text-right">Rate</th>
                                    <th className="p-2 text-right">Total (₹)</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                  {subData.items.map((item, idx, arr) => {
                                    const prevItem = arr[idx - 1];
                                    const showSubSub = idx === 0 || prevItem.subSubHeading !== item.subSubHeading;

                                    return (
                                      <tr key={item.id}>
                                        <td className="p-2 text-black font-bold">
                                          {showSubSub ? (item.subSubHeading || '-') : ''}
                                        </td>
                                        <td className="p-2 font-bold text-black">{item.item}</td>
                                        <td className="p-2 font-mono text-[10px] text-slate-600">{item.dimText}</td>
                                        <td className="p-2 text-right font-bold">{item.qty.toFixed(2)} {item.unitType === 'sqft' ? 'Sq Ft' : 'RFT'}</td>
                                        <td className="p-2 text-right">₹{item.rate}</td>
                                        <td className="p-2 text-right font-bold">₹{item.cost.toLocaleString('en-IN', { maximumFractionDigits: 2 })}</td>
                                      </tr>
                                    );
                                  })}
                                </tbody>
                              </table>

                              <div className="bg-slate-50 px-3 py-1.5 border-t border-slate-200 text-[11px] font-bold text-slate-800 flex justify-between">
                                <span>Sub-Total for "{subName}":</span>
                                <div className="space-x-4">
                                  <span>Area: {subData.sqft.toFixed(2)} Sq Ft</span>
                                  {subData.rft > 0 && <span>RFT: {subData.rft.toFixed(2)} Ft</span>}
                                  <span className="text-emerald-700">Cost: ₹{subData.cost.toLocaleString('en-IN', { maximumFractionDigits: 2 })}</span>
                                </div>
                              </div>

                            </div>
                          ))}

                        </div>
                      );
                    })}
                  </div>

                  <div className="pt-4 border-t-2 border-slate-900 flex justify-between items-center text-sm font-bold">
                    <span>GRAND TOTAL ESTIMATED AMOUNT</span>
                    <span className="text-emerald-700 text-base">₹{totals.cost.toLocaleString('en-IN', { maximumFractionDigits: 0 })}</span>
                  </div>

                </div>
              </div>
            )}

          </main>

          {/* VERIFY & CONFIRM ENTRY POPUP MODAL */}
          {pendingEntryModal && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 no-print">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full p-6 space-y-4 animate-fade-in">
                <div className="flex items-center justify-between border-b pb-3 border-slate-200">
                  <div className="flex items-center space-x-2">
                    <span className="bg-amber-500 text-slate-900 p-1.5 rounded-lg text-base font-bold">🔍</span>
                    <h3 className="font-extrabold text-base text-slate-900">Verify Entry Calculations</h3>
                  </div>
                  <span className="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded-full border border-amber-300 uppercase">
                    Preview Mode
                  </span>
                </div>

                <div className="space-y-2.5 text-xs">
                  <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-1">
                    <p><strong className="text-slate-600">Main Section:</strong> <span className="font-bold text-slate-900">{pendingEntryModal.section}</span></p>
                    <p><strong className="text-slate-600">Sub-Heading:</strong> <span className="font-bold text-slate-900">{pendingEntryModal.subHeading}</span></p>
                    {pendingEntryModal.subSubHeading && (
                      <p><strong className="text-slate-600">Sub-Sub Heading:</strong> <span className="font-bold text-slate-900">{pendingEntryModal.subSubHeading}</span></p>
                    )}
                    <p><strong className="text-slate-600">Item Description:</strong> <span className="font-bold text-slate-900">{pendingEntryModal.item}</span></p>
                  </div>

                  <div className="bg-amber-50/70 p-3 rounded-lg border border-amber-200 space-y-1.5 font-mono text-[11px]">
                    <p><strong className="text-slate-700 font-sans">Material Category:</strong> <span className="text-slate-900 font-bold">{pendingEntryModal.category}</span></p>
                    <p><strong className="text-slate-700 font-sans">Dimensions Text:</strong> <span className="text-blue-700 font-bold">{pendingEntryModal.dimText}</span></p>
                    <p><strong className="text-slate-700 font-sans">Base Qty Calculated:</strong> {pendingEntryModal.baseQty} {pendingEntryModal.unitType === 'sqft' ? 'Sq Ft' : 'RFT'}</p>
                    <p><strong className="text-slate-700 font-sans">Multiplier (X):</strong> {pendingEntryModal.multiplier}</p>
                  </div>

                  <div className="bg-emerald-50 p-3 rounded-lg border border-emerald-200 space-y-1 text-slate-900">
                    <div className="flex justify-between items-center">
                      <span>Total Net Quantity:</span>
                      <strong className="text-sm font-bold text-slate-900">{pendingEntryModal.qty.toFixed(2)} {pendingEntryModal.unitType === 'sqft' ? 'Sq Ft' : 'RFT'}</strong>
                    </div>
                    <div className="flex justify-between items-center">
                      <span>Applied Rate:</span>
                      <strong className="text-slate-800">₹{pendingEntryModal.rate} / {pendingEntryModal.unitType === 'sqft' ? 'Sq Ft' : 'RFT'}</strong>
                    </div>
                    <div className="flex justify-between items-center border-t border-emerald-300 pt-1.5 text-emerald-800 text-sm font-extrabold">
                      <span>Total Calculated Cost:</span>
                      <span className="text-emerald-700 text-base font-black">₹{pendingEntryModal.totalCost.toLocaleString('en-IN', { maximumFractionDigits: 2 })}</span>
                    </div>
                  </div>
                </div>

                <div className="flex justify-end space-x-2 pt-2 border-t border-slate-200">
                  <button 
                    type="button" 
                    onClick={() => setPendingEntryModal(null)} 
                    className="px-4 py-2 rounded-lg text-xs font-semibold text-slate-700 hover:bg-slate-100 border border-slate-300"
                  >
                    ✏️ Edit Entry
                  </button>
                  <button 
                    type="button" 
                    onClick={handleConfirmAddEntry} 
                    className="px-5 py-2 rounded-lg text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white shadow"
                  >
                    ✓ Confirm & Add
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* NEW SITE MODAL */}
          {isNewSiteModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 no-print">
              <div className="bg-white rounded-xl shadow-xl border border-slate-200 max-w-md w-full p-6 space-y-4">
                <h3 className="font-bold text-lg text-slate-800">Create New Site Project</h3>
                <form onSubmit={handleCreateSite} className="space-y-3">
                  <div>
                    <label className="block text-xs font-medium text-slate-600 mb-1">Site / Project Name</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Villa 42 Palm Avenue"
                      value={newSiteData.name}
                      onChange={e => setNewSiteData({...newSiteData, name: e.target.value})}
                      className="w-full text-sm border border-slate-300 rounded-lg p-2"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-600 mb-1">Client Name</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Mr. Rajesh Kumar"
                      value={newSiteData.client}
                      onChange={e => setNewSiteData({...newSiteData, client: e.target.value})}
                      className="w-full text-sm border border-slate-300 rounded-lg p-2"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-600 mb-1">Site Address</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Sector 14, Karnal"
                      value={newSiteData.address}
                      onChange={e => setNewSiteData({...newSiteData, address: e.target.value})}
                      className="w-full text-sm border border-slate-300 rounded-lg p-2"
                    />
                  </div>
                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setIsNewSiteModalOpen(false)} className="px-4 py-2 rounded-lg text-xs font-medium text-slate-600 hover:bg-slate-100">
                      Cancel
                    </button>
                    <button type="submit" className="px-4 py-2 rounded-lg text-xs font-bold bg-amber-500 hover:bg-amber-600 text-slate-900">
                      Create Site
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
